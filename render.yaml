# Render Blueprint for the PMS: Django API, React static site, and Postgres.
# Docs: https://render.com/docs/blueprint-spec
#
# The persistent disk below is for uploaded media files. Render disks require a
# paid web-service instance, and only files written under the mount path survive
# deploys/restarts. If you remove the disk, uploads become ephemeral unless you
# add object storage such as S3 or Cloudflare R2.

databases:
  - name: pms-db
    databaseName: pmsdb
    user: pms
    plan: free

services:
  - type: web
    name: pms-backend
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: "bash build.sh"
    startCommand: "bash start.sh"
    healthCheckPath: /healthz/
    disk:
      name: pms-media
      mountPath: /var/data/media
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: pms-db
          property: connectionString
      - key: MEDIA_ROOT
        value: /var/data/media
      - key: WEB_CONCURRENCY
        value: "2"
      # The /api/* rewrite on the frontend service makes the SPA same-origin
      # with the API, so Lax works and keeps the browser's CSRF protection.
      # Only switch to "None" if you stop using that proxy.
      - key: COOKIE_SAMESITE
        value: "Lax"
      - key: DATA_UPLOAD_MAX_MEMORY_SIZE
        value: "10485760"
      - key: FILE_UPLOAD_MAX_MEMORY_SIZE
        value: "10485760"

      # Fill these in the Render dashboard after the public URLs are assigned.
      - key: ALLOWED_HOSTS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false

      # SMTP for two-step login codes. Without these, 2FA logins are
      # refused (the app fails closed rather than skipping the factor).
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      # Render sits behind a proxy, so X-Forwarded-For is trustworthy here
      # and per-IP rate limiting keys on the real client address.
      - key: TRUST_PROXY_HEADERS
        value: "True"

  # Hourly iCal auto-sync. The command only syncs properties whose per-property
  # interval is due, so running hourly is safe regardless of those settings.
  - type: cron
    name: pms-calendar-sync
    runtime: python
    rootDir: backend
    plan: starter
    schedule: "0 * * * *"
    buildCommand: "bash build.sh"
    startCommand: "python manage.py sync_calendars"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: pms-db
          property: connectionString

  - type: web
    name: pms-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "npm ci && npm run build"
    staticPublishPath: dist
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: same-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'"
    routes:
      # Proxy /api to the backend so the browser sees ONE origin. This makes the
      # session/CSRF cookies first-party, which iOS/Safari requires (it blocks
      # cross-site cookies). The /api rule MUST come before the SPA catch-all.
      - type: rewrite
        source: /api/*
        destination: https://property-management-system-beeo.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # IMPORTANT: leave VITE_API_BASE_URL EMPTY when using the /api proxy above.
      # The SPA then calls /api on its own origin and the proxy relays it to the
      # backend. Setting it to the backend URL re-introduces the cross-site issue.
      - key: VITE_API_BASE_URL
        sync: false
